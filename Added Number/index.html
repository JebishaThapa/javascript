<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adding Number</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Saira+Condensed:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h2 class="title">Finding the largest number in an array</h2>
        <div class="inputField">
            <input type="text"id="inputValue" class="inputValue" placeholder="Enter your numbers..">
            <button id="btn">Add</button>
        </div>
        <div class="boxes">
            <div class="output-box" id="output-box">
                <h4>Output</h4>
                <p id="output-list"></p>
            </div>
            <div class="largest-box" id="largest-box">
                <h4>Largest Number</h4>
                <p> </p>
                <p id="largest-result"></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>

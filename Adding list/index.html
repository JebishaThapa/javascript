<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adding List</title>
</head>
<body>
    <div class="container">
        <h2 id="title">To-Do Items</h2>
        <form onsubmit="event.preventDefault()
        ">
            <input type="text" id="todo-input" placeholder="Add a list..">
            <button id="todo-button" type="submit">Add</button>
        </form>
        <ul id="list"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
